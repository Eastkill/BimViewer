<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The app resolves ./wasm/ relative to the document; point it at the dev-server root. -->
    <base href="/" />
    <title>BIM Viewer — testy i pomiary</title>
    <style>
      body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: #0b1220; color: #e2e8f0; }
      header { padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      header h1 { font-size: 16px; margin: 0 12px 0 0; }
      button { padding: 6px 12px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: inherit; cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: wait; }
      #status { margin-left: auto; color: #94a3b8; }
      main { display: grid; grid-template-columns: 1280px 1fr; gap: 12px; padding: 0 16px 16px; }
      canvas { width: 1280px; height: 720px; display: block; background: #000; }
      pre { margin: 0; padding: 12px; background: #020617; border-radius: 6px; overflow: auto; max-height: 720px; font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <h1>BIM Viewer — testy i pomiary</h1>
      <button data-suite="all">Wszystko</button>
      <button data-suite="validation">Walidacja</button>
      <button data-suite="calculations">Obliczenia</button>
      <button data-suite="performance">Wydajność</button>
      <button data-suite="render">Renderowanie</button>
      <button id="download">Pobierz JSON</button>
      <span id="status">inicjalizacja…</span>
    </header>
    <main>
      <canvas id="benchCanvas"></canvas>
      <pre id="log"></pre>
    </main>
    <script type="module" src="/tests/bench/bench.js"></script>
  </body>
</html>
