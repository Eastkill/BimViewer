<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BIM Viewer - IFC Reader</title>
    <script type="module" crossorigin src="/assets/index-BmoExxKh.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/three-core-BgNcoYFv.js">
    <link rel="modulepreload" crossorigin href="/assets/three-extras-Dg33ptAH.js">
    <link rel="stylesheet" crossorigin href="/assets/index-CPbH0lnO.css">
  </head>
  <body>
    <main class="layout">
      <aside class="sidebar">
        <h1>BIM Viewer (WebGPU)</h1>
        <p class="subtitle">Wczytaj plik IFC i obejrzyj model 3D.</p>

        <section class="card">
          <label for="ifcFile" class="file-label">Plik IFC</label>
          <input id="ifcFile" type="file" accept=".ifc,.ifcZIP,.ifczip" />
          <button id="loadButton" type="button">Wczytaj IFC</button>
        </section>

        <section class="card">
          <h2>Informacje</h2>
          <pre id="output">Brak danych. Wybierz plik IFC i kliknij "Wczytaj IFC".</pre>
        </section>

        <section class="card">
          <h2>Warstwy branzowe</h2>
          <div id="layerControls" class="layer-controls"></div>
        </section>

        <section class="card">
          <h2>Kolizje miedzy warstwami</h2>
          <div class="collision-controls">
            <select id="collisionLayerA"></select>
            <select id="collisionLayerB"></select>
            <button id="detectCollisionsButton" type="button">Wykryj kolizje</button>
          </div>
          <pre id="collisionOutput">Brak analizy kolizji.</pre>
        </section>
      </aside>

      <section class="viewport">
        <canvas id="viewerCanvas" aria-label="Podglad modelu IFC"></canvas>
      </section>
    </main>

  </body>
</html>
